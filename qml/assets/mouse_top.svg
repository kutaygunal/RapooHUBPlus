<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560">
  <defs>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f6f7f9"/>
      <stop offset="0.45" stop-color="#e0e3e8"/>
      <stop offset="1" stop-color="#aeb4be"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa1ab"/>
      <stop offset="1" stop-color="#cdd2d9"/>
    </linearGradient>
    <linearGradient id="shellL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e6eb"/>
    </linearGradient>
    <linearGradient id="shellR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f3f6"/>
      <stop offset="1" stop-color="#d8dce2"/>
    </linearGradient>
    <linearGradient id="rest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3c8d0"/>
      <stop offset="1" stop-color="#959ca7"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5059"/>
      <stop offset="0.35" stop-color="#b8bec7"/>
      <stop offset="0.55" stop-color="#e3e6ea"/>
      <stop offset="1" stop-color="#454b54"/>
    </linearGradient>
    <linearGradient id="metalV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5059"/>
      <stop offset="0.4" stop-color="#c3c8cf"/>
      <stop offset="0.6" stop-color="#e3e6ea"/>
      <stop offset="1" stop-color="#454b54"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dde3"/>
      <stop offset="1" stop-color="#f7f8fa"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- floor shadow -->
  <ellipse cx="214" cy="300" rx="200" ry="262" fill="url(#floor)"/>

  <!-- body -->
  <path fill="url(#body)" stroke="#8f96a1" stroke-width="1.4"
        d="M222 28 C300 26 352 86 366 176 C380 268 378 372 352 444 C330 506 280 540 214 540
           C156 540 112 520 82 490 C50 458 26 424 26 382 C26 348 50 330 66 314
           C70 290 72 252 80 214 C96 118 146 30 222 28 Z"/>

  <!-- thumb-side wall -->
  <path fill="url(#wall)" opacity="0.95"
        d="M80 204 C74 262 70 312 63 352 C74 360 88 364 100 364 C102 318 106 262 114 198 C102 198 90 200 80 204 Z"/>

  <!-- thumb rest with grip waves -->
  <path fill="url(#rest)"
        d="M30 386 C34 352 60 340 92 356 C126 374 146 430 146 488 C144 512 126 520 106 510
           C64 488 30 444 30 386 Z"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2">
    <path d="M44 392 C70 380 100 392 116 420"/>
    <path d="M46 410 C74 398 106 410 124 440"/>
    <path d="M52 428 C80 418 112 430 130 462"/>
    <path d="M60 446 C88 438 118 452 134 484"/>
    <path d="M72 464 C98 458 124 472 136 500"/>
  </g>

  <!-- main buttons -->
  <path fill="url(#shellL)" stroke="#a6acb5" stroke-width="1.2"
        d="M217 34 C156 38 118 96 112 186 C150 196 186 202 216 202 Z"/>
  <path fill="url(#shellR)" stroke="#a6acb5" stroke-width="1.2"
        d="M227 34 C290 38 338 96 350 186 C312 196 262 202 228 202 Z"/>
  <path fill="url(#gloss)" d="M206 44 C164 50 136 92 128 150 C150 120 176 92 206 80 Z"/>

  <!-- scroll wheel -->
  <rect x="204" y="52" width="36" height="100" rx="17" fill="#24282f"/>
  <rect x="209" y="57" width="26" height="90" rx="13" fill="url(#metal)"/>
  <g stroke="#2f343c" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
    <line x1="211" y1="64" x2="233" y2="64"/><line x1="211" y1="71" x2="233" y2="71"/>
    <line x1="211" y1="78" x2="233" y2="78"/><line x1="211" y1="85" x2="233" y2="85"/>
    <line x1="211" y1="92" x2="233" y2="92"/><line x1="211" y1="99" x2="233" y2="99"/>
    <line x1="211" y1="106" x2="233" y2="106"/><line x1="211" y1="113" x2="233" y2="113"/>
    <line x1="211" y1="120" x2="233" y2="120"/><line x1="211" y1="127" x2="233" y2="127"/>
    <line x1="211" y1="134" x2="233" y2="134"/><line x1="211" y1="141" x2="233" y2="141"/>
  </g>
  <rect x="215" y="57" width="5" height="90" rx="2.5" fill="#ffffff" opacity="0.35"/>

  <!-- DPI button with LED -->
  <rect x="211" y="174" width="22" height="40" rx="11" fill="#d7dbe1" stroke="#8a919c" stroke-width="1.4"/>
  <rect x="215" y="178" width="14" height="32" rx="7" fill="url(#shellL)"/>
  <circle cx="222" cy="186" r="2.6" fill="#3d7eff"/>

  <!-- seam -->
  <path d="M118 236 C170 254 282 254 354 230" fill="none" stroke="#a9afb8" stroke-width="1.2"/>

  <!-- side buttons and thumb wheel -->
  <path fill="url(#side)" stroke="#8a919c" stroke-width="1.3"
        d="M84 210 C88 206 98 206 101 212 L99 254 C96 260 86 260 82 254 Z"/>
  <rect x="73" y="266" width="24" height="38" rx="11" fill="#24282f"/>
  <rect x="76" y="269" width="18" height="32" rx="8" fill="url(#metalV)"/>
  <g stroke="#2f343c" stroke-width="2" opacity="0.7">
    <line x1="78" y1="273" x2="78" y2="297"/><line x1="83" y1="272" x2="83" y2="298"/>
    <line x1="88" y1="272" x2="88" y2="298"/><line x1="92" y1="273" x2="92" y2="297"/>
  </g>
  <path fill="url(#side)" stroke="#8a919c" stroke-width="1.3"
        d="M76 314 C80 310 92 310 95 316 L93 356 C90 362 78 362 74 356 Z"/>

  <!-- logo -->
  <text x="252" y="452" font-family="Segoe UI, Arial" font-size="24" font-weight="600"
        fill="#9aa1ab" transform="rotate(-8 252 452)">MT760</text>
</svg>
